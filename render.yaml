# Optional hosting; local demonstration needs no database or worker.
# Build trains the two small benchmark models. Review host capacity before deployment.
services:
  - type: web
    name: heart-qml-prototype
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: CORS_ORIGINS
        sync: false
